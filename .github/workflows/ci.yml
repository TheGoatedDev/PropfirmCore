name: ci

on:
    pull_request:
    push:
        branches: [main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: actionlint
              env:
                  ACTIONLINT_VERSION: 1.7.12
                  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c
                  tar xzf actionlint.tar.gz actionlint
                  ./actionlint -color

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm deps:check

    e2e:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: propfirm
                    POSTGRES_PASSWORD: propfirm
                    POSTGRES_DB: propfirm
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U propfirm"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10
        env:
            DATABASE_URL: postgres://propfirm:propfirm@localhost:5432/propfirm
            NATS_URL: nats://localhost:4222
            NATS_TOKEN: dev
            INGEST_API_KEY: dev
            BETTER_AUTH_SECRET: change-me-to-a-long-random-string
            BETTER_AUTH_URL: http://localhost:3000
            BOOTSTRAP_ADMIN_EMAIL: admin@example.com
            BOOTSTRAP_ADMIN_PASSWORD: changeme
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm

            - run: docker run -d --name nats -p 4222:4222 nats:2-alpine -js -auth dev
            - run: |
                  for i in $(seq 1 30); do
                    nc -z localhost 4222 && exit 0
                    sleep 1
                  done
                  echo "nats did not start" >&2
                  exit 1

            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm e2e
